<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="我的食記"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.svg"><title>我的食記</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252b27;background:#f7f8f6}*{box-sizing:border-box}body{margin:0}.app{max-width:700px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 14px 88px}.head{font-size:21px;font-weight:700;margin:2px 0 15px}.head small{display:block;font-size:12px;font-weight:400;color:#849087;margin-top:4px}.search{height:44px;width:100%;border:1px solid #e2e7e2;border-radius:13px;padding:0 13px;background:white}.actions{display:flex;gap:9px;margin:9px 0 18px}.actions button,.save,.add-dish{border:0;border-radius:12px;height:42px;padding:0 13px;background:#354e3e;color:#fff;font-weight:650}.actions button+button,.add-dish{background:#eaf0eb;color:#354e3e}.label{font-size:12px;color:#7c857d;margin-bottom:8px}.tagbar{display:flex;gap:7px;overflow:auto}.tag{white-space:nowrap;border:1px solid #e1e7e1;background:#fff;color:#68736a;border-radius:99px;padding:7px 11px;font-size:12px}.tag.active{background:#354e3e;color:#fff}.stores{margin-top:15px}.store{border:1px solid #e6eae6;background:#fff;border-radius:16px;padding:13px;margin-bottom:10px}.storehead{display:flex;justify-content:space-between;gap:8px}.store-name{font-size:16px;font-weight:700}.kind{font-size:11px;background:#eef2ee;color:#637166;border-radius:99px;padding:6px 9px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;background:#f3f5f2;border-radius:99px;color:#718073;padding:5px 8px}.dish-list{border-top:1px solid #edf0ed;margin-top:12px}.dish{padding:10px 0;border-bottom:1px solid #f0f2f0}.dish:last-child{border:0}.dish-title{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.score{font-size:12px;color:#9a713e;white-space:nowrap}.detail,.note{font-size:12px;line-height:1.5;color:#737d74;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.note{color:#58665b}.add-dish{width:100%;height:38px;font-size:13px;margin-top:10px}.empty{padding:34px 10px;text-align:center;color:#858e86;font-size:14px}.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),500px);height:48px;border:0;border-radius:15px;background:#354e3e;color:white;font-weight:700;box-shadow:0 8px 20px #283a2b33}.shade{position:fixed;inset:0;background:#17231c70;display:none;align-items:flex-end;justify-content:center}.shade.open{display:flex}.sheet{background:#f7f8f6;width:min(100%,700px);max-height:92dvh;overflow:auto;border-radius:21px 21px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:6px}.close{border:0;background:none;font-size:26px;color:#778078}label{display:block;font-size:12px;color:#6e786f;margin:12px 0 5px}input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #e1e6e1;border-radius:12px;background:#fff;padding:10px 12px;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252b27}input[type=text],input[type=number],select{height:44px}textarea{height:66px;resize:vertical}.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}.type-choice{display:flex;align-items:center;gap:7px;background:#fff;padding:10px;border:1px solid #e1e6e1;border-radius:11px;font-size:13px}.type-choice input{accent-color:#354e3e}.rating-number{font-size:18px;font-weight:700;color:#354e3e}.rating{width:100%;accent-color:#354e3e}.save{width:100%;margin-top:16px;height:46px}.hint{font-size:11px;color:#879087;margin-top:4px}.hidden{display:none!important}@media(min-width:700px){.app{padding:30px 18px 100px}.stores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.store{margin:0}.fab{left:auto;right:max(24px,calc((100vw - 700px)/2 + 18px));transform:none;width:220px}}
+input[type=text],input[type=number],input[type=search],select,textarea{font-size:16px!important}
+.editbtn{border:0;border-radius:9px;background:#eef2ee;color:#354e3e;padding:6px 9px;font-size:12px;white-space:nowrap}.dish-title{align-items:center}</style></head>
<body>
<main class="app"><header class="head">我的食記<small>收藏喜歡的店家和菜單</small></header><input id="search" class="search" type="search" placeholder="搜尋店家或菜名"><div class="actions"><button id="addStore">＋ 新增店家</button><button id="addDish">＋ 新增菜</button></div><div class="label">標籤分類</div><div id="tagbar" class="tagbar"></div><section id="stores" class="stores"></section></main>
<button id="fab" class="fab">＋ 新增店家</button><div id="shade" class="shade"><section class="sheet"><div class="sheet-head"><span id="title"></span><button id="close" class="close">×</button></div><form id="form"></form></section></div>
<script>
(()=>{'use strict';const KEY='my_food_journal_v3';const types={drink:'飲料店',restaurant:'餐廳',convenience:'便利商店',other:'其他'};let data={stores:[]};let tagFilter='';try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(saved.stores))data=saved}catch{}const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const splitTags=s=>s.split(/[,，、]/).map(x=>x.trim()).filter(Boolean).slice(0,10);function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('無法儲存，請檢查裝置儲存空間。')}}function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function getTags(){return [...new Set(data.stores.flatMap(s=>[...(s.tags||[]),...(s.dishes||[]).flatMap(d=>d.tags||[])]))].sort()}function render(){const q=$('#search').value.trim().toLowerCase();const tagList=getTags();$('#tagbar').innerHTML='<button class="tag '+(!tagFilter?'active':'')+'" data-tag="">全部</button>'+tagList.map(t=>'<button class="tag '+(tagFilter===t?'active':'')+'" data-tag="'+esc(t)+'"># '+esc(t)+'</button>').join('');const visible=data.stores.filter(s=>(!q||s.name.toLowerCase().includes(q)||(s.dishes||[]).some(d=>d.name.toLowerCase().includes(q)))&&(!tagFilter||(s.tags||[]).includes(tagFilter)||(s.dishes||[]).some(d=>(d.tags||[]).includes(tagFilter))));$('#stores').innerHTML=visible.length?visible.map(s=>{const dishHtml=(s.dishes||[]).map((d,i)=>({d,i})).filter(x=>(!q||s.name.toLowerCase().includes(q)||x.d.name.toLowerCase().includes(q))&&(!tagFilter||(s.tags||[]).includes(tagFilter)||(x.d.tags||[]).includes(tagFilter))).map(x=>'<div class="dish"><div class="dish-title"><span>'+esc(x.d.name)+'</span><span class="score">'+Number(x.d.rating||0)+'/10</span><button type="button" class="editbtn" data-edit-dish="'+esc(s.id)+'" data-index="'+x.i+'">編輯</button></div>'+(x.d.type==='drink'?'<div class="detail">'+esc(x.d.sweet)+'・'+esc(x.d.ice)+'</div>':'')+(x.d.price?'<div class="detail">價格：$'+esc(x.d.price)+'</div>':'')+(x.d.note?'<div class="note">備註：'+esc(x.d.note)+'</div>':'')+((x.d.tags||[]).length?'<div class="badges">'+x.d.tags.map(t=>'<span class="badge"># '+esc(t)+'</span>').join('')+'</div>':'')+'</div>').join('');return '<article class="store"><div class="storehead"><span class="store-name">'+esc(s.name)+'</span><span class="kind">'+(types[s.type]||'其他')+'</span><button type="button" class="editbtn" data-edit-store="'+esc(s.id)+'">編輯店家</button></div>'+((s.tags||[]).length?'<div class="badges">'+s.tags.map(t=>'<span class="badge"># '+esc(t)+'</span>').join('')+'</div>':'')+'<div class="dish-list">'+dishHtml+'</div><button class="add-dish" data-store="'+esc(s.id)+'">＋ 新增這家店的菜</button></article>'}).join(''):'<div class="empty">'+(data.stores.length?'沒有符合的店家或菜。':'先新增一家店家，再記下喜歡的菜。')+'</div>'}function openForm(kind,storeId,dishIndex){const f=$('#form');const store=data.stores.find(s=>s.id===storeId);const oldDish=kind==='dish'&&dishIndex!==undefined&&store?store.dishes[dishIndex]:null;const editing=kind==='store'?!!storeId:!!oldDish;$('#shade').classList.add('open');if(kind==='store'){const current=store||{};$('#title').textContent=editing?'編輯店家':'新增店家';f.innerHTML='<label>店家名稱</label><input name="name" type="text" placeholder="輸入店家名稱" required maxlength="50" value="'+esc(current.name||'')+'"><label>店家類型</label><div class="types">'+[['drink','飲料店'],['restaurant','餐廳'],['convenience','便利商店'],['other','其他']].map(x=>'<label class="type-choice"><input type="radio" name="kind" value="'+x[0]+'" '+((current.type||'drink')===x[0]?'checked':'')+'>'+x[1]+'</label>').join('')+'</div><label>店家標籤</label><input name="tags" type="text" placeholder="例如：常去、台北" value="'+esc((current.tags||[]).join(', '))+'"><div class="hint">多個標籤用逗號分開</div><button class="save">'+(editing?'儲存修改':'儲存店家')+'</button>'}else{$('#title').textContent=editing?'編輯菜單':'新增菜單';const current=oldDish||{};const selectedStoreId=oldDish?storeId:storeId;const selectOptions=data.stores.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selectedStoreId?'selected':'')+'>'+esc(s.name)+'（'+(types[s.type]||'其他')+'）</option>').join('');const choice=(values,selected)=>values.map(v=>'<option '+(v===(selected||values[0])?'selected':'')+'>'+v+'</option>').join('');f.innerHTML='<label>店家</label><select name="store">'+selectOptions+'</select><label>菜名</label><input name="name" type="text" placeholder="輸入菜名或品項" required maxlength="50" value="'+esc(current.name||'')+'"><div id="drink" class="hidden"><label>甜度</label><select name="sweet">'+choice(['無糖','微糖','半糖','少糖','全糖'],current.sweet||'全糖')+'</select><label>冰塊</label><select name="ice">'+choice(['去冰','微冰','少冰','正常冰','熱飲'],current.ice||'少冰')+'</select></div><label>評分 <span id="ratingNum" class="rating-number">'+Number(current.rating||8)+'</span> / 10</label><input class="rating" name="rating" type="range" min="1" max="10" value="'+Number(current.rating||8)+'"><label>備註</label><textarea name="note" maxlength="240" placeholder="例如：飯糰太鹹">'+esc(current.note||'')+'</textarea><label>價格（選填）</label><input name="price" type="number" min="0" step="1" placeholder="例如：120" value="'+esc(current.price||'')+'"><label>菜品標籤</label><input name="tags" type="text" placeholder="例如：招牌、必點" value="'+esc((current.tags||[]).join(', '))+'"><div class="hint">多個標籤用逗號分開</div><button class="save">'+(editing?'儲存修改':'儲存菜單')+'</button>';const updateDrink=()=>{const selected=data.stores.find(s=>s.id===f.elements.store.value);$('#drink').classList.toggle('hidden',selected?.type!=='drink')};f.elements.store.addEventListener('change',updateDrink);f.elements.rating.addEventListener('input',e=>$('#ratingNum').textContent=e.target.value);updateDrink()}f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);if(kind==='store'){if(editing){store.name=fd.get('name').trim();store.type=fd.get('kind');store.tags=splitTags(fd.get('tags')||'')}else{data.stores.unshift({id:makeId(),name:fd.get('name').trim(),type:fd.get('kind'),tags:splitTags(fd.get('tags')||''),dishes:[]})}}else{const target=data.stores.find(x=>x.id===fd.get('store'));if(!target)return;const drink=target.type==='drink';const updated={name:fd.get('name').trim(),rating:Number(fd.get('rating')),note:(fd.get('note')||'').trim(),price:(fd.get('price')||'').trim(),tags:splitTags(fd.get('tags')||''),type:drink?'drink':'',sweet:drink?fd.get('sweet'):'',ice:drink?fd.get('ice'):''};if(editing){if(target.id===storeId){store.dishes[dishIndex]=updated}else{store.dishes.splice(dishIndex,1);target.dishes.push(updated)}}else{target.dishes.push(updated)}}save();$('#shade').classList.remove('open');render()}}$('#addStore').onclick=()=>openForm('store');$('#fab').onclick=()=>openForm('store');$('#addDish').onclick=()=>data.stores.length?openForm('dish',''):openForm('store');$('#close').onclick=()=>$('#shade').classList.remove('open');$('#shade').onclick=e=>{if(e.target.id==='shade')$('#shade').classList.remove('open')};$('#search').oninput=render;$('#tagbar').onclick=e=>{const b=e.target.closest('[data-tag]');if(b){tagFilter=b.dataset.tag;render()}};$('#stores').onclick=e=>{const eb=e.target.closest('[data-edit-store]');if(eb){openForm('store',eb.dataset.editStore);return}const db=e.target.closest('[data-edit-dish]');if(db){openForm('dish',db.dataset.editDish,Number(db.dataset.index));return}const ab=e.target.closest('[data-store]');if(ab)openForm('dish',ab.dataset.store)};render()})();</script></body></html>
